[project]
name = "merkury"
version = "0.15"
description = "Turn Python scripts into HTML reports"
authors = [ {name = "Piotr Patrzyk"}, ]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["analytics", "reporting", "data", "data science", ]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "docopt>=0.6.2,<1",
    "Jinja2>=3.1.6,<4",
    "Markdown>=3.11.2,<4",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.15.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<1",
]
server = [
    "starlette>=1.9.0,<2",
    "uvicorn>=0.54.0,<1",
]

[project.urls]
Source = "https://github.com/ppatrzyk/merkury"

[project.scripts]
merkury = "merkury.main:main"

[build-system]
requires = ["setuptools", ]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "DEBUG"

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
extend-exclude = ["tests/dir", "tests/scripts", "docs"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
