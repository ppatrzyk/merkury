[project]
name = "merkury"
version = "0.12"
description = "Turn Python scripts into HTML reports"
authors = [ {name = "Piotr Patrzyk"}, ]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["analytics", "reporting", "data", "data science", ]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "docopt>=0.6.2",
    "Jinja2>=3.1.6",
    "Markdown>=3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
server = [
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.urls]
Source = "https://github.com/ppatrzyk/merkury"

[project.scripts]
merkury = "merkury.main:main"

[build-system]
requires = ["setuptools", ]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
extend-exclude = ["tests/dir", "tests/scripts"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
